<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Emti, the MTplatitudes mascot</title>
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC861"/>
      <stop offset="1" stop-color="#F5A524"/>
    </linearGradient>
    <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8962A"/>
      <stop offset="1" stop-color="#C47714"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454B6B"/>
      <stop offset="1" stop-color="#33384F"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#E0A93B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Empty speech bubble: her catchphrase is nothing at all. -->
  <g transform="translate(360 52)">
    <path d="M10 0 H120 Q136 0 136 16 V58 Q136 74 120 74 H52 L30 96 L34 74 H10 Q-6 74 -6 58 V16 Q-6 0 10 0 Z"
          fill="#FFFFFF" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
    <path d="M118 -14 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#FFD166"/>
  </g>

  <!-- Back hair: chin-length bob, ends flip outward -->
  <path d="M136 210 C128 118 190 74 256 74 C322 74 384 118 376 210
           C380 262 384 300 404 318 C380 330 356 322 344 306
           L168 306 C156 322 132 330 108 318 C128 300 132 262 136 210 Z"
        fill="url(#hairDark)"/>
  <!-- Body: oversized hoodie -->
  <path d="M150 470 C150 400 186 352 256 352 C326 352 362 400 362 470 Z" fill="url(#hoodie)"/>
  <!-- Hood rim behind the neck -->
  <path d="M196 352 C206 336 306 336 316 352 C300 372 212 372 196 352 Z" fill="#2E3247"/>
  <!-- Sleeve paws -->
  <ellipse cx="170" cy="462" rx="34" ry="24" fill="#3C4260"/>
  <ellipse cx="342" cy="462" rx="34" ry="24" fill="#3C4260"/>
  <path d="M144 452 Q170 440 196 452" stroke="#F5A524" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M316 452 Q342 440 368 452" stroke="#F5A524" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Drawstrings -->
  <path d="M236 366 C234 390 232 404 230 420" stroke="#FFE8D6" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M276 366 C278 390 280 404 282 420" stroke="#FFE8D6" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="230" cy="424" r="6" fill="#FFE8D6"/>
  <circle cx="282" cy="424" r="6" fill="#FFE8D6"/>
  <!-- Little "~$" on the hoodie -->
  <text x="304" y="428" text-anchor="middle" font-family="DejaVu Sans Mono, monospace"
        font-size="18" font-weight="bold" fill="#F5A524">~$_</text>

  <!-- Lanyard and key (keeper / elevate) -->
  <path d="M214 350 C220 372 240 382 256 386 C272 382 292 372 298 350" stroke="#E2E4F0"
        stroke-width="4" fill="none"/>
  <g transform="translate(256 386) rotate(12) scale(0.9)">
    <circle cx="0" cy="8" r="11" fill="url(#key)" stroke="#B5821F" stroke-width="2.5"/>
    <circle cx="0" cy="8" r="4" fill="#33384F"/>
    <rect x="-3.5" y="18" width="7" height="26" rx="2" fill="url(#key)" stroke="#B5821F" stroke-width="2"/>
    <rect x="3" y="32" width="8" height="5" fill="url(#key)" stroke="#B5821F" stroke-width="1.5"/>
    <rect x="3" y="40" width="6" height="4" fill="url(#key)" stroke="#B5821F" stroke-width="1.5"/>
  </g>

  <!-- Neck -->
  <rect x="236" y="300" width="40" height="44" rx="12" fill="#F7CDB9"/>

  <!-- Face -->
  <path d="M152 212 C152 150 196 118 256 118 C316 118 360 150 360 212
           C360 280 312 322 256 322 C200 322 152 280 152 212 Z" fill="#FFE5D6"/>

  <!-- Eyebrows -->
  <path d="M196 196 Q214 188 232 194" stroke="#B5701A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M280 194 Q298 188 316 196" stroke="#B5701A" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Bob sides, flipping out at the ends -->
  <path d="M148 176 C136 230 136 280 150 304 C138 314 122 316 110 312 C130 298 136 270 140 230 C142 206 144 190 148 176 Z" fill="url(#hair)"/>
  <path d="M364 176 C376 230 376 280 362 304 C374 314 390 316 402 312 C382 298 376 270 372 230 C370 206 368 190 364 176 Z" fill="url(#hair)"/>
  <path d="M148 180 C140 240 146 286 166 306 C178 296 176 250 178 206 Z" fill="url(#hair)"/>
  <path d="M364 180 C372 240 366 286 346 306 C334 296 336 250 334 206 Z" fill="url(#hair)"/>
  <!-- Bangs -->
  <path d="M142 204 C136 116 196 76 256 76 C316 76 376 116 370 204
           Q358 196 350 214 Q346 186 336 168
           Q332 192 320 210 Q318 180 306 156
           Q300 190 290 216 Q286 186 276 160
           Q270 186 258 204 Q252 180 240 156
           Q232 188 222 216 Q218 186 206 160
           Q196 186 190 210 Q184 186 176 168
           Q168 190 162 214 Q156 196 142 204 Z"
        fill="url(#hair)"/>
  <!-- Hair shine -->
  <path d="M196 104 C220 92 250 90 270 94" stroke="#FFE7B0" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Ahoge -->
  <path d="M250 80 C238 58 244 36 266 26 C262 42 266 56 262 80 Z" fill="url(#hair)"/>
  <path d="M258 80 C262 60 274 50 290 50 C278 58 270 68 266 80 Z" fill="url(#hairDark)"/>

  <!-- Cursor hair clip, softly glowing -->
  <rect x="318" y="128" width="16" height="28" rx="2" fill="#7EFFC8" filter="url(#glow)" opacity="0.9"/>
  <rect x="320" y="130" width="12" height="24" rx="1.5" fill="#B6FFE0" stroke="#2B2D42" stroke-width="3"/>

  <!-- Eyes: closed and contented -->
  <path d="M188 246 Q214 218 240 246" stroke="#2B2D42" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M190 240 L180 232" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
  <path d="M272 246 Q298 218 324 246" stroke="#2B2D42" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M322 240 L332 232" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
  <!-- Blush -->
  <ellipse cx="194" cy="268" rx="18" ry="9" fill="#FF9EB0" opacity="0.55"/>
  <ellipse cx="318" cy="268" rx="18" ry="9" fill="#FF9EB0" opacity="0.55"/>

  <!-- Small, satisfied "w" smile -->
  <path d="M238 282 Q246 296 256 284 Q266 296 274 282" stroke="#2B2D42" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
