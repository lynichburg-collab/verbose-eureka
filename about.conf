# Global settings for the OS build. Read by forge.

# Identity. Renaming the OS is a change here (plus the kernel's default
# hostname in config/linux/generic.fragment).
OS_ID="mtplatitudes"
OS_NAME="MTplatitudes"
OS_VERSION="0.1.0"

# Target architecture. Only x86_64 for now; the parts are written so a
# second architecture (aarch64) can be added later.
ARCH="x86_64"

# Parts, in build order. Each name maps to parts/<name>.part.
PARTS="linux busybox keeper tripwire"
