# mdev rules: device permissions and actions when hardware appears.
# Device nodes themselves are created by the kernel (devtmpfs).
#
# Lines starting with "-" log the event and keep matching later lines.
-$DEVTYPE=usb_device root:root 0660 */core/boot/device-event
-$SUBSYSTEM=block     root:disk 0660 */core/boot/device-event
$MODALIAS=.*    root:root 0660 @modprobe -q "$MODALIAS"
null            root:root 0666
zero            root:root 0666
full            root:root 0666
random          root:root 0666
urandom         root:root 0666
tty             root:tty  0666
ptmx            root:tty  0666
tty[0-9]+       root:tty  0620
ttyS[0-9]+      root:tty  0660
input/.*        root:input 0660
snd/.*          root:audio 0660
dri/.*          root:video 0660
fb[0-9]+        root:video 0660
sd[a-z].*       root:disk 0660
nvme.*          root:disk 0660
