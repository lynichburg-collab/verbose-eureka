# Global settings for the OS build. Sourced by build.sh.

# Identity. Renaming the OS is a one-line change here.
OS_ID="verbose-eureka"
OS_NAME="Verbose Eureka"
OS_VERSION="0.1.0"

# Target architecture. Only x86_64 for now; the recipes are written so a
# second architecture (aarch64) can be added later.
ARCH="x86_64"

# Packages, in build order. Each name maps to recipes/<name>.recipe.
PACKAGES="linux busybox init"
